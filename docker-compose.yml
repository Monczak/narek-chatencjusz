services:
  bot:
    build:
      context: .
      dockerfile: services/bot/Dockerfile
    container_name: narek-chatencjusz-bot
    env_file:
      - ./services/bot/.env
    environment:
      - BRAIN_URL=brain:5050
      - VALKEY_URL=valkey://valkey:6379
    restart: unless-stopped
    networks:
      - internal

  brain:
    build:
      context: .
      dockerfile: services/brain/Dockerfile
    container_name: narek-chatencjusz-brain
    environment:
      - Valkey__Url=valkey:6379
    restart: unless-stopped
    networks:
      - internal

  valkey:
    image: valkey/valkey:9-alpine
    container_name: narek-chatencjusz-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - internal

networks:
  internal:
    driver: bridge
