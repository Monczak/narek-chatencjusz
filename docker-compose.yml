services:
  bot:
    build:
      context: .
      dockerfile: services/bot/Dockerfile
    env_file:
      - ./services/bot/.env
    environment:
      - BRAIN_URL=brain:5050
      - VALKEY_URL=valkey://valkey:6379
    restart: unless-stopped
    depends_on:
      - brain
    networks:
      - internal

  brain:
    build:
      context: .
      dockerfile: services/brain/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:8080;http://+:5050
      - Valkey__Url=valkey:6379
      - Mongo__Url=mongodb://mongo:27017
      - Mongo__Database=narek-chatencjusz
      - Asr__Url=asr:6060
      - Llm__SystemPromptFile=/app/prompts/system_prompt.txt
      - Llm__RambleHintFile=/app/prompts/ramble_hint.txt
      - Llm__Defaults__ProviderUrl=http://llm:7070
    ports:
     - "8080:8080"
    restart: unless-stopped
    depends_on:
      - asr
      - mongo
      - valkey
    networks:
      - internal
    volumes:
      - brain_models:/app/models

  asr:
    build:
      context: .
      dockerfile: services/asr/Dockerfile
    environment:
      - ASR_MODEL=large-v3-turbo
      - ASR_DEVICE=cuda
      - ASR_COMPUTE_TYPE=float16
      - ASR_FLASH_ATTENTION=true
      - ASR_NUM_WORKERS=1
      - ASR_BEAM_SIZE=5
      - ASR_GRPC_PORT=6060
    restart: unless-stopped
    networks:
      - internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - asr_model_cache:/root/.cache/huggingface

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command: >
      -m /models/model.gguf
      --port 7070
      --host 0.0.0.0
      -ngl 99
      --ctx-size 8192
      --parallel 1
    ports:
      - "7070:7070"
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - ./models/model.gguf:/models/model.gguf
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - internal

  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - internal

networks:
  internal:

volumes:
  asr_model_cache:
  mongo_data:
  brain_models:
