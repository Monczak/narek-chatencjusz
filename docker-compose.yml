services:
  bot:
    build:
      context: .
      dockerfile: services/bot/Dockerfile
    env_file:
      - ./services/bot/.env
    environment:
      - BRAIN_URL=brain:5050
      - VALKEY_URL=valkey://valkey:6379
    restart: unless-stopped
    networks:
      - internal

  brain:
    build:
      context: .
      dockerfile: services/brain/Dockerfile
    environment:
      - Valkey__Url=valkey:6379
    ports:
     - "8080:8080"
    restart: unless-stopped
    networks:
      - internal

  asr:
    build:
      context: .
      dockerfile: services/asr/Dockerfile
    restart: unless-stopped
    networks:
      - internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - internal

networks:
  internal:
