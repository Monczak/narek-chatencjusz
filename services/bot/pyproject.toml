[project]
name = "bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dependency-injector>=4.48.3",
    "grpcio>=1.76.0",
    "grpcio-tools>=1.76.0",
    "py-cord>=2.7.1",
    "pydantic-settings>=2.12.0",
    "pynacl>=1.6.2",
    "python-dotenv>=1.2.1",
    "silero-vad>=6.2.0",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "valkey>=6.1.1",
]

[dependency-groups]
dev = [
    "mypy-protobuf>=5.0.0",
    "types-protobuf>=6.32.1.20251210",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
