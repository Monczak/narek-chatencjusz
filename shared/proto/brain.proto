syntax = "proto3";

option csharp_namespace = "BrainService.Proto.Brain";

package brain;

service Brain {
  // Simple heartbeat
  rpc Ping (PingRequest) returns (PingResponse);

  // Voice control
  rpc JoinChannel (JoinChannelRequest) returns (JoinChannelResponse);
  rpc LeaveChannel (LeaveChannelRequest) returns (LeaveChannelResponse);

  // Voice session state and events
  rpc NotifyVoiceState (VoiceStateNotification) returns (VoiceStateAck);
  rpc StreamVoiceSessionEvents (stream VoiceSessionEvent) returns (VoiceSessionEventAck);

  // Per-guild LLM configuration
  rpc GetGuildSettings (GetGuildSettingsRequest) returns (GetGuildSettingsResponse);
  rpc UpdateGuildSettings (UpdateGuildSettingsRequest) returns (UpdateGuildSettingsResponse);
  rpc GetAvailableModels (GetAvailableModelsRequest) returns (GetAvailableModelsResponse);
  rpc GetAvailableVoices (GetAvailableVoicesRequest) returns (GetAvailableVoicesResponse);

  // Global bot node configuration
  rpc GetBotSettings (GetBotSettingsRequest) returns (GetBotSettingsResponse);
  rpc UpdateBotSettings (UpdateBotSettingsRequest) returns (UpdateBotSettingsResponse);
}

message GuildContext {
  uint64 id = 1;
  string name = 2;
}

message ChannelContext {
  uint64 id = 1;
  string name = 2;
}

message UserContext {
  uint64 id = 1;
  string display_name = 2;
}

enum VoiceStateReason {
  UNKNOWN = 0;
  MANUAL_MOVE = 1;        // User moved bot
  MANUAL_DISCONNECT = 2;  // User disconnected bot
  RECONCILE_MISSING = 3;  // Bot was connected but state was missing
  RECONCILE_DRIFT = 4;    // Bot was in channel A, state said B
  CONNECT = 5;            // Bot successfully executed a Connect command
  DISCONNECT = 6;         // Bot successfully executed a Disconnect command
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
}

message JoinChannelRequest {
  GuildContext guild = 1;
  ChannelContext channel = 2;
  string node_id = 3;
  optional string correlation_id = 4;
  optional string session_id = 5;
}

message JoinChannelResponse {
  bool success = 1;
  string message = 2;
  string session_id = 3;
}

message LeaveChannelRequest {
  GuildContext guild = 1;
  string node_id = 2;
  optional string correlation_id = 3;
}

message LeaveChannelResponse {
  bool success = 1;
}

message VoiceStateNotification {  
  optional string session_id = 1;
  GuildContext guild = 2;
  optional ChannelContext channel = 3;
  string node_id = 4;
  VoiceStateReason reason = 5;
}

message VoiceStateAck {
  bool success = 1;
}

// --- Event Streaming ---

message VoiceSessionEvent {
  optional string session_id = 1;
  GuildContext guild = 2;
  string node_id = 3;
  int64 timestamp = 4;

  oneof event_data {
    UserVoiceStateUpdate user_state = 5;
    UserSpeakingUpdate user_speaking = 6;
    SessionUpdate session_update = 7;
    ChannelStateSnapshot channel_state_snapshot = 8;
  }
}

message UserVoiceStateUpdate {
  UserContext user = 1;
  ChannelContext channel = 2;

  enum ChangeType {
    UNKNOWN = 0;
    JOINED = 1;
    LEFT = 2;
  }
  ChangeType change_type = 3;
}

message UserSpeakingUpdate {
  UserContext user = 1;
  bool is_speaking = 2;
}

message SessionUpdate {
  enum ChangeType {
    UNKNOWN = 0;
    STARTED = 1;
    ENDED = 2;
    MOVED = 3;
    UNSTABLE = 4;
  }
  ChangeType change_type = 1;
  ChannelContext channel = 2;
}

message ChannelStateSnapshot {
  ChannelContext channel = 1;
  repeated UserContext users = 2;
}

message VoiceSessionEventAck {
  bool success = 1;
}

// --- Event-Driven Messages ---

message ConnectVoice {
  string session_id = 1;
  GuildContext guild = 2;
  ChannelContext channel = 3;
  optional string correlation_id = 4;
}

message DisconnectVoice {
  string session_id = 1;
  GuildContext guild = 2;
  optional string correlation_id = 3;
}

message ErrorMessage {
  GuildContext guild = 1;
  string message = 2;
  optional string correlation_id = 3;
}

message RefreshBotConfig {}

message BrainCommand {
  oneof command {
    ConnectVoice connect = 1;
    DisconnectVoice disconnect = 2;
    ErrorMessage error = 3;
    RefreshBotConfig refresh_bot_config = 4;
  }
}

// --- Per-Guild LLM Configuration ---

// All fields are optional; absent means "not overriding the server default".
message GuildConfig {
  optional string system_prompt = 1;
  optional string custom_instructions = 2;
  optional string bot_name = 3;
  optional float temperature = 4;
  optional int32 max_tokens = 5;
  optional int32 silence_threshold_ms = 6;
  optional bool ramble_mode_enabled = 7;
  optional int32 ramble_threshold_ms = 8;
  optional string ramble_system_hint = 9;
  optional string time_zone = 10;
  optional string model_name = 11;
  optional float repetition_penalty = 12;
  optional bool tools_enabled = 13;
  optional string tts_voice_id = 14;
  optional int32 interrupt_threshold_ms = 15;
  optional int32 soundboard_drain_buffer_ms = 16;
}

message GetGuildSettingsRequest {
  uint64 guild_id = 1;
}

message GetGuildSettingsResponse {
  GuildConfig resolved = 1;
  GuildConfig overrides = 2;
}

message UpdateGuildSettingsRequest {
  uint64 guild_id = 1;
  GuildConfig patch = 2;
  repeated string clear_fields = 3;
}

message UpdateGuildSettingsResponse {
  bool success = 1;
  string message = 2;
}

message GetAvailableModelsRequest {}

message GetAvailableModelsResponse {
  repeated string model_names = 1;
}

message GetAvailableVoicesRequest {}

message TtsVoiceInfo {
  string voice_id = 1;
  string display_name = 2;
  string provider_type = 3;
}

message GetAvailableVoicesResponse {
  repeated TtsVoiceInfo voices = 1;
}

// --- Global Bot Node Configuration ---

// Settings that apply to all bot nodes globally, managed by the Brain.
message BotNodeConfig {
  bool skip_silence_check = 1;
}

message GetBotSettingsRequest {}

message GetBotSettingsResponse {
  BotNodeConfig config = 1;
}

message UpdateBotSettingsRequest {
  BotNodeConfig patch = 1;
}

message UpdateBotSettingsResponse {
  bool success = 1;
}
