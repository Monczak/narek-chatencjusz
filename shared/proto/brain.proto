syntax = "proto3";

option csharp_namespace = "BrainService.Proto";

package brain;

service Brain {
  // Simple heartbeat
  rpc Ping (PingRequest) returns (PingResponse);

  // Voice control
  rpc JoinChannel (JoinChannelRequest) returns (JoinChannelResponse);
  rpc LeaveChannel (LeaveChannelRequest) returns (LeaveChannelResponse);

  rpc NotifyVoiceState (VoiceStateNotification) returns (VoiceStateAcknowledgement);
}

enum VoiceStateReason {
  UNKNOWN = 0;
  MANUAL_MOVE = 1;       // User moved bot
  MANUAL_DISCONNECT = 2; // User disconnected bot
  RECONCILE_MISSING = 3; // Bot was connected but state was missing
  RECONCILE_DRIFT = 4;   // Bot was in channel A, state said B
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
}

message JoinChannelRequest {
  string guild_id = 1;
  string channel_id = 2;
  string node_id = 3;
  optional string correlation_id = 4;
}

message JoinChannelResponse {
  bool success = 1;
  string message = 2;
}

message LeaveChannelRequest {
  string guild_id = 1;
  string node_id = 2;
  optional string correlation_id = 3;
}

message LeaveChannelResponse {
  bool success = 1;
}

message VoiceStateNotification {  
  string guild_id = 1;
  string node_id = 2;
  optional string channel_id = 3;
  VoiceStateReason reason = 4;
}

message VoiceStateAcknowledgement {
  bool success = 1;
}

// --- Event-Driven Messages ---

message ConnectVoice {
  string guild_id = 1;
  string channel_id = 2;
  optional string correlation_id = 3;
}

message DisconnectVoice {
  string guild_id = 1;
  optional string correlation_id = 2;
}

message ErrorMessage {
  string guild_id = 1;
  string message = 2;
  optional string correlation_id = 3;
}

message BrainCommand {
  oneof command {
    ConnectVoice connect = 1;
    DisconnectVoice disconnect = 2;
    ErrorMessage error = 3;
  }
}

